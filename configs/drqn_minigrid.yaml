# DRQN MiniGrid Hyperparameters
# Adaptation of DQN to MiniGrid-MemoryS7-v0

env:
  name: "MiniGrid-MemoryS7-v0"
  input_shape: [3, 7, 7]   # (C, H, W) after transpose

training:
  num_episodes: 500
  learning_rate: 0.001
  gamma: 0.99
  batch_size: 32
  buffer_capacity: 500     # stores full episodes, not transitions
  seq_len: 8               # sequence length sampled for LSTM training
  target_update_freq: 10   # episodes

exploration:
  epsilon_start: 1.0
  epsilon_end: 0.1
  epsilon_decay: 0.995     # multiplicative per episode

model:
  lstm_hidden_size: 128

seeds: [42, 123, 7]

# Why DRQN instead of DQN:
# MiniGrid-MemoryS7 is partially observable - the agent sees only a 7x7
# local view. It must remember an object seen at the start of the corridor
# and act on that memory at the end. A feedforward DQN has no memory
# mechanism and will plateau/fail. The LSTM hidden state carries information
# forward across timesteps within an episode, enabling the agent to
# remember what it saw earlier.
